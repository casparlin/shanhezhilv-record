<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>山河之旅 · 游戏记录</title>
  <style>
    :root {
      --primary: #1a7a3a;
      --primary-light: #e8f5e9;
      --accent: #ff6b35;
      --bg: #f7faf7;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #666;
      --border: #c8e6c9;
      --danger: #e53935;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }
    .screen { display: none; padding: 16px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
    .screen.active { display: block; }
    h1 { font-size: 1.5rem; color: var(--primary); text-align: center; margin-bottom: 4px; }
    .subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:active { background: #145c2c; }
    .btn-secondary { background: var(--primary-light); color: var(--primary); }
    .btn-danger { background: #ffebee; color: var(--danger); }
    .btn-outline {
      background: white;
      border: 1.5px solid var(--border);
      color: var(--text);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .player-inputs { display: flex; flex-direction: column; gap: 8px; }
    .city-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 12px 0;
    }
    .city-card {
      background: transparent;
      border: none;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-all;
    }
    .city-card:active { transform: scale(0.97); opacity: 0.9; }
    .actions { display: flex; gap: 10px; margin-top: 16px; }
    .actions .btn { flex: 1; }
    .history {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--muted);
      max-height: 180px;
      overflow-y: auto;
    }
    .history-item {
      padding: 6px 0;
      border-bottom: 1px dashed #e0e0e0;
    }
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
      padding: 0;
    }
    .modal {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px 32px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal h3 { font-size: 1.15rem; margin-bottom: 14px; text-align: center; }
    .player-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .player-btns .btn { padding: 14px; font-size: 1.05rem; }
    .letter-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 12px;
      justify-content: center;
    }
    .letter-nav button {
      width: 28px; height: 28px;
      border: none;
      border-radius: 6px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .letter-nav button.active { background: var(--primary); color: white; }
    .letter-nav button:disabled { opacity: 0.3; }
    .city-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-height: 50vh;
      overflow-y: auto;
    }
    .city-list button {
      padding: 10px 4px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: white;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .city-list button:active { background: var(--primary-light); border-color: var(--primary); }
    .city-list button.used { opacity: 0.4; text-decoration: line-through; }
    .result-header { text-align: center; margin-bottom: 16px; }
    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    .result-row {
      display: grid;
      grid-template-columns: 36px 1fr 1fr 1fr;
      gap: 6px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      align-items: center;
    }
    .result-row.header {
      font-weight: 600;
      color: var(--muted);
      font-size: 0.8rem;
      border-bottom: 2px solid var(--border);
    }
    .step-num {
      font-weight: 700;
      color: var(--primary);
      text-align: center;
    }
    .city-cell {
      text-align: center;
      position: relative;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .final-info {
      margin-top: 20px;
      padding: 14px;
      background: var(--primary-light);
      border-radius: 10px;
      text-align: center;
    }
    .final-info p { margin: 4px 0; }
    .back-btn { margin-top: 20px; }
  </style>
</head>
<body>

  <!-- ========== SETUP ========== -->
  <div id="setup" class="screen active">
    <h1>山河之旅</h1>
    <p class="subtitle">游戏记录助手</p>

    <div class="card">
      <label>玩家人数</label>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button class="btn btn-outline" style="flex:1" onclick="setPlayerCount(2)">2人</button>
        <button class="btn btn-outline" style="flex:1" onclick="setPlayerCount(3)">3人</button>
        <button class="btn btn-outline" style="flex:1" onclick="setPlayerCount(4)">4人</button>
      </div>
      <div id="playerInputs" class="player-inputs"></div>
    </div>

    <div class="card">
      <label>选择开局三张城市卡 <span id="selectedCount" style="color:var(--primary)">(0/3)</span></label>
      <div id="initialCitiesDisplay" style="min-height:40px;margin:8px 0;font-size:1.1rem;color:var(--primary);font-weight:600;"></div>
      <button class="btn btn-secondary" onclick="openCityPicker('initial')">选择城市</button>
    </div>

    <button class="btn btn-primary" id="startBtn" disabled onclick="startGame()">开始游戏</button>
    <button class="btn btn-outline" id="historyBtn" style="margin-top:12px;" onclick="openHistory()">历史记录</button>
  </div>

  <!-- ========== GAME ========== -->
  <div id="game" class="screen">
    <h1>当前三张城市</h1>
    <p class="subtitle" id="playersLabel"></p>

    <div class="city-grid" id="currentBoard"></div>

    <div class="actions">
      <button class="btn btn-danger" id="undoBtn" disabled onclick="undo()">撤销</button>
      <button class="btn btn-primary" onclick="endGame()">结束游戏</button>
    </div>

    <div class="history" id="historyLog"></div>
  </div>

  <!-- ========== RESULT ========== -->
  <div id="result" class="screen">
    <div class="result-header">
      <h1>游戏记录</h1>
      <p class="subtitle" id="resultPlayers"></p>
      <p class="subtitle" id="resultMeta" style="font-size:0.85rem;margin-top:4px;color:var(--muted);"></p>
    </div>

    <!-- 历史切换 -->
    <div id="historyNav" style="display:none;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;">
      <button class="btn btn-outline" style="width:auto;padding:8px 14px;font-size:0.9rem;" onclick="prevHistory()">← 上一盘</button>
      <span id="historyIndexLabel" style="font-size:0.9rem;color:var(--muted);"></span>
      <button class="btn btn-outline" style="width:auto;padding:8px 14px;font-size:0.9rem;" onclick="nextHistory()">下一盘 →</button>
    </div>

    <div class="card" style="padding:12px;">
      <div class="result-row header">
        <div></div>
        <div>位置1</div>
        <div>位置2</div>
        <div>位置3</div>
      </div>
      <div id="resultRows"></div>
    </div>

    <div class="final-info" id="finalInfo"></div>

    <button class="btn btn-secondary back-btn" onclick="location.reload()">再玩一局</button>
    <button class="btn btn-danger" id="deleteRecordBtn" style="margin-top:10px;display:none;" onclick="deleteCurrentHistory()">删除此记录</button>
  </div>

  <!-- ========== MODALS ========== -->
  <div id="playerModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeModal('playerModal')">
    <div class="modal">
      <h3>谁拿走了「<span id="takenCityName"></span>」？</h3>
      <div class="player-btns" id="playerBtns"></div>
      <button class="btn btn-outline" style="margin-top:14px;" onclick="closeModal('playerModal')">取消</button>
    </div>
  </div>

  <div id="cityModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeModal('cityModal')">
    <div class="modal">
      <h3 id="cityModalTitle">选择城市</h3>
      <div class="letter-nav" id="letterNav"></div>
      <div class="city-list" id="cityList"></div>
      <button class="btn btn-outline" style="margin-top:14px;" onclick="closeModal('cityModal')">取消</button>
    </div>
  </div>

  <!-- 选择获胜者 -->
  <div id="winnerModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeModal('winnerModal')">
    <div class="modal">
      <h3>谁获得了胜利？</h3>
      <div class="player-btns" id="winnerBtns"></div>
      <button class="btn btn-outline" style="margin-top:14px;" onclick="closeModal('winnerModal')">取消</button>
    </div>
  </div>

<script>
// ========== 城市列表（49个代表性城市，按拼音首字母） ==========
const CITIES = [
  "阿克苏","澳门",
  "北京","包头",
  "成都","重庆","长春","长沙","常州","赤峰",
  "大连","敦煌","大理",
  "鄂尔多斯",
  "福州","凤凰",
  "广州","桂林","贵阳",
  "哈尔滨","海口","杭州","合肥","呼和浩特","黄山",
  "济南","佳木斯","嘉峪关",
  "昆明","喀什",
  "拉萨","兰州","丽江","洛阳",
  "绵阳",
  "南昌","南京","南宁","宁波",
  "青岛","泉州",
  "日喀则",
  "厦门","上海","深圳","沈阳","石家庄","苏州",
  "太原","天津","吐鲁番",
  "乌鲁木齐","无锡","武汉",
  "西安","西宁","西双版纳","香港",
  "银川","宜昌",
  "张家界","郑州","珠海"
].sort((a,b) => a.localeCompare(b, 'zh'));

// 拼音首字母映射（简化，用于导航）
const PINYIN_MAP = {
  "阿克苏":"A","澳门":"A",
  "北京":"B","包头":"B",
  "成都":"C","重庆":"C","长春":"C","长沙":"C","常州":"C","赤峰":"C",
  "大连":"D","敦煌":"D","大理":"D",
  "鄂尔多斯":"E",
  "福州":"F","凤凰":"F",
  "广州":"G","桂林":"G","贵阳":"G",
  "哈尔滨":"H","海口":"H","杭州":"H","合肥":"H","呼和浩特":"H","黄山":"H",
  "济南":"J","佳木斯":"J","嘉峪关":"J",
  "昆明":"K","喀什":"K",
  "拉萨":"L","兰州":"L","丽江":"L","洛阳":"L",
  "绵阳":"M",
  "南昌":"N","南京":"N","南宁":"N","宁波":"N",
  "青岛":"Q","泉州":"Q",
  "日喀则":"R",
  "厦门":"X","上海":"S","深圳":"S","沈阳":"S","石家庄":"S","苏州":"S",
  "太原":"T","天津":"T","吐鲁番":"T",
  "乌鲁木齐":"W","无锡":"W","武汉":"W",
  "西安":"X","西宁":"X","西双版纳":"X","香港":"X",
  "银川":"Y","宜昌":"Y",
  "张家界":"Z","郑州":"Z","珠海":"Z"
};

// ========== 城市分值数据库 ==========
const CITY_SCORES = {
  "阿克苏": 4, "澳门": 3,
  "北京": 0, "包头": 2,
  "成都": 3, "重庆": 3, "长春": 2, "长沙": 2, "常州": 2, "赤峰": 2,
  "大连": 2, "敦煌": 4, "大理": 4,
  "鄂尔多斯": 3,
  "福州": 3, "凤凰": 3,
  "广州": 3, "桂林": 3, "贵阳": 3,
  "哈尔滨": 3, "海口": 4, "杭州": 2, "合肥": 2, "呼和浩特": 2, "黄山": 2,
  "济南": 1, "佳木斯": 3, "嘉峪关": 4,
  "昆明": 3, "喀什": 4,
  "拉萨": 4, "兰州": 3, "丽江": 4, "洛阳": 2,
  "绵阳": 3,
  "南昌": 2, "南京": 2, "南宁": 3, "宁波": 2,
  "青岛": 2, "泉州": 3,
  "日喀则": 4,
  "厦门": 3, "上海": 2, "深圳": 3, "沈阳": 2, "石家庄": 1, "苏州": 2,
  "太原": 1, "天津": 1, "吐鲁番": 4,
  "乌鲁木齐": 4, "无锡": 2, "武汉": 2,
  "西安": 2, "西宁": 3, "西双版纳": 4, "香港": 3,
  "银川": 3, "宜昌": 2,
  "张家界": 3, "郑州": 1, "珠海": 3
};

const SCORE_COLORS = {
  0: { main: "#9e9e9e", light: "#f5f5f5", dark: "#616161", border: "#bdbdbd" },
  1: { main: "#1e88e5", light: "#e3f2fd", dark: "#0d47a1", border: "#64b5f6" },
  2: { main: "#43a047", light: "#e8f5e9", dark: "#1b5e20", border: "#81c784" },
  3: { main: "#8d6e63", light: "#efebe9", dark: "#4e342e", border: "#a1887f" },
  4: { main: "#8e24aa", light: "#f3e5f5", dark: "#4a148c", border: "#ba68c8" }
};

function getScore(city) {
  return CITY_SCORES[city] ?? 2;
}

function cityCardHtml(city) {
  const s = getScore(city);
  const c = SCORE_COLORS[s] || SCORE_COLORS[2];
  return `
    <div style="
      position:relative;
      width:100%;
      border:2.5px solid ${c.main};
      border-radius:10px;
      background:${c.light};
      padding:20px 8px 14px;
      box-sizing:border-box;
    ">
      <div style="
        position:absolute;
        top:-14px; left:-2px;
        background:transparent;
        padding:0 4px;
        font-size:1.6rem;
        font-weight:800;
        color:${c.main};
        line-height:1;
        text-shadow: -1.5px -1.5px 0 ${c.light}, 1.5px -1.5px 0 ${c.light}, -1.5px 1.5px 0 ${c.light}, 1.5px 1.5px 0 ${c.light};
      ">${s}</div>
      <div style="
        font-size:1.3rem;
        font-weight:700;
        color:${c.dark};
        text-align:center;
        line-height:1.25;
      ">${city}</div>
    </div>`;
}

function cityCellHtml(city, isTaken, taker) {
  const s = getScore(city);
  const c = SCORE_COLORS[s] || SCORE_COLORS[2];
  const borderW = isTaken ? '2.5px' : '1.8px';
  const takerHtml = isTaken 
    ? `<div style="font-size:0.65rem;color:${c.main};font-weight:600;margin-top:3px;text-align:center;">${taker} +${s}</div>` 
    : '';
  return `
    <div class="city-cell ${isTaken ? 'taken' : ''}" style="
      position:relative;
      border:${borderW} solid ${c.main};
      border-radius:8px;
      background:${c.light};
      padding:15px 4px 8px;
      min-height:54px;
    ">
      <div style="
        position:absolute;
        top:-11px; left:-1px;
        background:transparent;
        padding:0 3px;
        font-size:1.1rem;
        font-weight:800;
        color:${c.main};
        line-height:1;
        text-shadow: -1.2px -1.2px 0 ${c.light}, 1.2px -1.2px 0 ${c.light}, -1.2px 1.2px 0 ${c.light}, 1.2px 1.2px 0 ${c.light};
      ">${s}</div>
      <div style="
        font-size:0.98rem;
        font-weight:700;
        color:${c.dark};
        text-align:center;
        line-height:1.2;
      ">${city}</div>
      ${takerHtml}
    </div>`;
}

// ========== State ==========
let players = [];
let initialCities = [];
let currentBoard = [];
let history = [];
let pendingTakenIndex = -1;
let pendingTakenCity = "";
let cityPickerMode = "";
let usedCities = new Set();
let playerScores = {};
let gameStartTime = null;

const HISTORY_KEY = 'shanhe_game_history';
const MAX_HISTORY = 10;
let savedGames = [];
let historyViewIndex = -1;
let isViewingHistory = false;

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    savedGames = raw ? JSON.parse(raw) : [];
  } catch (e) {
    savedGames = [];
  }
}

function saveHistoryToStorage() {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(savedGames));
  } catch (e) {
    console.warn('保存历史失败', e);
  }
}

function formatDateTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatDuration(ms) {
  if (!ms || ms < 0) return '';
  const sec = Math.round(ms / 1000);
  if (sec < 60) return `${sec}秒`;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return s > 0 ? `${m}分${s}秒` : `${m}分钟`;
}

function setPlayerCount(n) {
  const container = document.getElementById('playerInputs');
  container.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = `玩家${i+1} 名字`;
    input.id = `player${i}`;
    input.addEventListener('input', checkStartReady);
    container.appendChild(input);
  }
  checkStartReady();
}

function checkStartReady() {
  const inputs = document.querySelectorAll('#playerInputs input');
  const namesOk = [...inputs].every(i => i.value.trim()) && inputs.length >= 2;
  const citiesOk = initialCities.length === 3;
  document.getElementById('startBtn').disabled = !(namesOk && citiesOk);
  document.getElementById('selectedCount').textContent = `(${initialCities.length}/3)`;
  document.getElementById('initialCitiesDisplay').textContent = initialCities.join('  ·  ') || '尚未选择';
}

function openCityPicker(mode) {
  cityPickerMode = mode;
  document.getElementById('cityModalTitle').textContent = mode === 'initial' ? '选择开局城市（可选3个）' : '选择新加入的城市';
  renderLetterNav();
  renderCityList('A');
  document.getElementById('cityModal').style.display = 'flex';
}

function renderLetterNav() {
  const letters = 'ABCDEFGHJKLMNPQRSTWXYZ'.split('');
  const nav = document.getElementById('letterNav');
  nav.innerHTML = '';
  letters.forEach(L => {
    const has = CITIES.some(c => (PINYIN_MAP[c] || c[0]) === L);
    const btn = document.createElement('button');
    btn.textContent = L;
    btn.disabled = !has;
    btn.onclick = () => {
      document.querySelectorAll('.letter-nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCityList(L);
    };
    nav.appendChild(btn);
  });
  const first = nav.querySelector('button:not(:disabled)');
  if (first) { first.classList.add('active'); }
}

function renderCityList(letter) {
  const list = document.getElementById('cityList');
  list.innerHTML = '';
  const filtered = CITIES.filter(c => (PINYIN_MAP[c] || c[0]) === letter);
  filtered.forEach(city => {
    const btn = document.createElement('button');
    btn.textContent = city;
    if (cityPickerMode === 'initial') {
      if (initialCities.includes(city)) btn.classList.add('used');
    } else if (cityPickerMode === 'replace') {
      if (currentBoard.includes(city) || usedCities.has(city)) btn.classList.add('used');
    }
    btn.onclick = () => {
      if (btn.classList.contains('used')) return;
      selectCity(city);
    };
    list.appendChild(btn);
  });
}

function selectCity(city) {
  if (cityPickerMode === 'initial') {
    if (initialCities.includes(city)) {
      initialCities = initialCities.filter(c => c !== city);
    } else if (initialCities.length < 3) {
      initialCities.push(city);
    }
    checkStartReady();
    if (initialCities.length === 3) closeModal('cityModal');
    else renderCityList(document.querySelector('.letter-nav button.active')?.textContent || 'A');
  } else if (cityPickerMode === 'hometown') {
    winnerHometown = city;
    const homePoints = getScore(city);
    playerScores[winnerName] = (playerScores[winnerName] || 0) + homePoints;
    closeModal('cityModal');
    showResult();
  } else {
    closeModal('cityModal');
    doReplace(city);
  }
}

function startGame() {
  players = [...document.querySelectorAll('#playerInputs input')].map(i => i.value.trim());
  currentBoard = [...initialCities];
  usedCities = new Set(initialCities);
  history = [];
  playerScores = {};
  players.forEach(p => playerScores[p] = 0);
  gameStartTime = Date.now();
  isViewingHistory = false;
  historyViewIndex = -1;
  document.getElementById('playersLabel').textContent = players.join(' / ');
  renderBoard();
  updateUndo();
  document.getElementById('setup').classList.remove('active');
  document.getElementById('game').classList.add('active');
}

function renderBoard() {
  const board = document.getElementById('currentBoard');
  board.innerHTML = '';
  currentBoard.forEach((city, idx) => {
    const div = document.createElement('div');
    div.className = 'city-card';
    div.innerHTML = cityCardHtml(city);
    div.onclick = () => onCityClick(idx, city);
    board.appendChild(div);
  });

  const scoreHtml = players.map(p => {
    const sc = playerScores[p] || 0;
    return `<span style="margin-right:12px;"><b>${p}</b> <span style="color:var(--primary)">${sc}分</span></span>`;
  }).join('');
  document.getElementById('playersLabel').innerHTML = scoreHtml;

  const log = document.getElementById('historyLog');
  log.innerHTML = history.map((h, i) => 
    `<div class="history-item">${i+1}. 「${h.taken}」(+${h.points||0}) 被 <b>${h.by}</b> 拿走 → 补上「${h.newCity}」</div>`
  ).join('');
}

function onCityClick(idx, city) {
  pendingTakenIndex = idx;
  pendingTakenCity = city;
  document.getElementById('takenCityName').textContent = city;
  const btns = document.getElementById('playerBtns');
  btns.innerHTML = '';
  players.forEach(p => {
    const b = document.createElement('button');
    b.className = 'btn btn-primary';
    b.textContent = p;
    b.onclick = () => {
      window._pendingPlayer = p;
      closeModal('playerModal');
      openCityPicker('replace');
    };
    btns.appendChild(b);
  });
  document.getElementById('playerModal').style.display = 'flex';
}

function doReplace(newCity) {
  const by = window._pendingPlayer;
  const boardBefore = [...currentBoard];
  const points = getScore(pendingTakenCity);
  currentBoard[pendingTakenIndex] = newCity;
  usedCities.add(newCity);
  playerScores[by] = (playerScores[by] || 0) + points;
  history.push({
    taken: pendingTakenCity,
    by: by,
    newCity: newCity,
    points: points,
    boardBefore: boardBefore,
    boardAfter: [...currentBoard],
    takenIndex: pendingTakenIndex
  });
  renderBoard();
  updateUndo();
}

function updateUndo() {
  document.getElementById('undoBtn').disabled = history.length === 0;
}

function undo() {
  if (history.length === 0) return;
  const last = history.pop();
  currentBoard = last.boardBefore;
  usedCities.delete(last.newCity);
  if (last.by && last.points) {
    playerScores[last.by] = Math.max(0, (playerScores[last.by] || 0) - last.points);
  }
  renderBoard();
  updateUndo();
}

let winnerName = '';
let winnerHometown = '';

function endGame() {
  const btns = document.getElementById('winnerBtns');
  btns.innerHTML = '';
  players.forEach(p => {
    const b = document.createElement('button');
    b.className = 'btn btn-primary';
    b.textContent = p;
    b.onclick = () => {
      winnerName = p;
      closeModal('winnerModal');
      cityPickerMode = 'hometown';
      document.getElementById('cityModalTitle').textContent = `选择「${p}」的老家（秘密目的地）`;
      renderLetterNav();
      renderCityList('A');
      document.getElementById('cityModal').style.display = 'flex';
    };
    btns.appendChild(b);
  });
  document.getElementById('winnerModal').style.display = 'flex';
}

function showResult(fromHistory = false) {
  if (!fromHistory && !isViewingHistory) {
    const endTime = Date.now();
    const record = {
      id: endTime,
      players: [...players],
      initialCities: [...initialCities],
      history: JSON.parse(JSON.stringify(history)),
      winnerName,
      winnerHometown,
      playerScores: {...playerScores},
      startTime: gameStartTime,
      endTime,
      duration: gameStartTime ? endTime - gameStartTime : 0
    };
    savedGames.unshift(record);
    if (savedGames.length > MAX_HISTORY) savedGames = savedGames.slice(0, MAX_HISTORY);
    saveHistoryToStorage();
    historyViewIndex = 0;
  }

  renderResultPage();
  document.getElementById('game').classList.remove('active');
  document.getElementById('setup').classList.remove('active');
  document.getElementById('result').classList.add('active');
}

function renderResultPage() {
  const isHist = isViewingHistory || historyViewIndex >= 0;
  let data;

  if (isViewingHistory && historyViewIndex >= 0 && savedGames[historyViewIndex]) {
    data = savedGames[historyViewIndex];
  } else {
    data = {
      players,
      initialCities,
      history,
      winnerName,
      winnerHometown,
      playerScores,
      startTime: gameStartTime,
      endTime: Date.now(),
      duration: gameStartTime ? Date.now() - gameStartTime : 0
    };
  }

  const nameHtml = data.players.map(p => {
    const isWin = p === data.winnerName;
    return isWin ? `<b style="color:var(--primary)">${p} 👑</b>` : p;
  }).join(' / ');
  document.getElementById('resultPlayers').innerHTML = nameHtml;

  const timeStr = formatDateTime(data.startTime);
  const durStr = formatDuration(data.duration);
  document.getElementById('resultMeta').textContent = 
    [timeStr, durStr ? `时长 ${durStr}` : ''].filter(Boolean).join('  ·  ');

  const nav = document.getElementById('historyNav');
  const delBtn = document.getElementById('deleteRecordBtn');
  if (savedGames.length > 0) {
    nav.style.display = 'flex';
    delBtn.style.display = 'block';
    const idx = historyViewIndex >= 0 ? historyViewIndex : 0;
    document.getElementById('historyIndexLabel').textContent = 
      `${idx + 1} / ${savedGames.length}`;
  } else {
    nav.style.display = 'none';
    delBtn.style.display = 'none';
  }

  const rows = document.getElementById('resultRows');
  let html = `<div class="result-row"><div class="step-num">开</div>`;
  data.initialCities.forEach(c => html += cityCellHtml(c, false));
  html += `</div>`;

  data.history.forEach((h, i) => {
    html += `<div class="result-row"><div class="step-num">${i+1}</div>`;
    h.boardBefore.forEach((c, idx) => {
      if (idx === h.takenIndex) {
        html += cityCellHtml(c, true, h.by);
      } else {
        html += cityCellHtml(c, false);
      }
    });
    html += `</div>`;
  });

  const finalBoard = data.history.length > 0 
    ? data.history[data.history.length-1].boardAfter 
    : data.initialCities;
  html += `<div class="result-row"><div class="step-num">终</div>`;
  finalBoard.forEach(c => html += cityCellHtml(c, false));
  html += `</div>`;
  rows.innerHTML = html;

  const scoreLines = data.players.map(p => {
    const sc = data.playerScores[p] || 0;
    const isWinner = p === data.winnerName;
    return `<span style="margin:0 8px;${isWinner ? 'font-weight:700;color:var(--primary)' : ''}">${p} ${sc}分${isWinner ? ' 🏆' : ''}</span>`;
  }).join('');
  const homePts = getScore(data.winnerHometown);
  document.getElementById('finalInfo').innerHTML = `
    <p style="font-size:1.15rem;margin-bottom:8px;">🏆 获胜者：<b>${data.winnerName}</b></p>
    <p>老家（秘密目的地）：<b style="color:var(--primary)">${data.winnerHometown}</b>（+${homePts}分）</p>
    <p style="margin-top:12px;">最终得分：${scoreLines}</p>
    <p style="margin-top:8px;color:var(--muted);font-size:0.9rem">共进行 ${data.history.length} 次打卡 · 老家分数已计入</p>
  `;
}

function openHistory() {
  loadHistory();
  if (savedGames.length === 0) {
    alert('还没有历史记录');
    return;
  }
  isViewingHistory = true;
  historyViewIndex = 0;
  showResult(true);
}

function prevHistory() {
  if (historyViewIndex < savedGames.length - 1) {
    historyViewIndex++;
    renderResultPage();
  }
}

function nextHistory() {
  if (historyViewIndex > 0) {
    historyViewIndex--;
    renderResultPage();
  }
}

function deleteCurrentHistory() {
  if (historyViewIndex < 0 || historyViewIndex >= savedGames.length) return;
  if (!confirm('确定删除这盘记录吗？')) return;
  savedGames.splice(historyViewIndex, 1);
  saveHistoryToStorage();
  if (savedGames.length === 0) {
    location.reload();
    return;
  }
  if (historyViewIndex >= savedGames.length) {
    historyViewIndex = savedGames.length - 1;
  }
  renderResultPage();
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

// 初始化
loadHistory();
setPlayerCount(2);
if (savedGames.length > 0) {
  const btn = document.getElementById('historyBtn');
  if (btn) btn.textContent = `历史记录（${savedGames.length}）`;
}
</script>
</body>
</html>
